# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: com.zs2p.plrs.mmrreport
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: Polaris_Fiori_Apps_D33
          url: http://d33polarishttps:443
          client: '010'
        app:
          name: ZS2P_FE_MMR
          description: Report for Material Master Plausibility Check
          package: ZPLRS_S2P
          transport: D33K902822
        exclude:
          - /test/
